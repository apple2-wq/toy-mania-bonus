<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no"
  >

  <title>Bonus Stage</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;

      background: black;

      font-family:
        Arial,
        "Hiragino Kaku Gothic ProN",
        sans-serif;
    }


    /* =========================
       ゲーム画面
    ========================= */

    #game {

      position: relative;

      width: 100vw;
      height: 100vh;

      overflow: hidden;

      background-image: url("bonus-bg.png");

      background-size: 100% 100%;

      background-position: center;

      background-repeat: no-repeat;

      cursor: none;
    }



    /* =========================
       上のスコア
    ========================= */

    #hud {

      position: absolute;

      top: 15px;
      left: 0;

      width: 100%;

      display: flex;

      justify-content: space-between;
      align-items: center;

      padding: 0 35px;

      z-index: 1000;

      pointer-events: none;
    }


    .scoreBox {

      font-size: 30px;

      font-weight: bold;

      padding: 8px 18px;

      border-radius: 15px;

      background: rgba(0, 0, 0, 0.60);

      border: 3px solid white;

      color: white;

      text-shadow:
        2px 2px 3px black;
    }


    #score1 {

      color: #55eaff;

      box-shadow:
        0 0 14px #55eaff;
    }


    #score2 {

      color: #ff6bba;

      box-shadow:
        0 0 14px #ff6bba;
    }


    #timer {

      font-size: 34px;

      font-weight: bold;

      padding: 8px 20px;

      color: #ffe76a;

      background: rgba(0, 0, 0, 0.65);

      border: 3px solid white;

      border-radius: 15px;

      text-shadow:
        2px 2px 4px black;
    }



    /* =========================
       的
    ========================= */

    .target {

      position: absolute;

      width: 100px;
      height: 100px;

      margin-left: -50px;
      margin-top: -50px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          #ffe65c 0%,
          #ffe65c 17%,
          #e53935 18%,
          #e53935 35%,
          white 36%,
          white 53%,
          #e53935 54%,
          #e53935 72%,
          white 73%
        );

      border: 5px solid #55351e;

      box-shadow:
        0 4px 6px rgba(0, 0, 0, .5),
        inset 0 0 8px rgba(0, 0, 0, .3);

      color: #542715;

      font-size: 21px;

      font-weight: 900;

      display: flex;

      justify-content: center;
      align-items: center;

      user-select: none;

      z-index: 50;

      transform-origin: center;
    }



    /* =========================
       照準
    ========================= */

    .crosshair {

      position: absolute;

      transform: translate(-50%, -50%);

      font-family: Arial, sans-serif;

      font-size: 65px;

      font-weight: bold;

      line-height: 1;

      pointer-events: none;

      user-select: none;

      z-index: 900;
    }



    /* 右Joy-Con / PLAYER 1 */

    #crosshair1 {

      left: 40%;
      top: 55%;

      color: #55eaff;

      text-shadow:
        0 0 4px black,
        0 0 10px #55eaff,
        0 0 18px #55eaff;
    }



    /* 左Joy-Con / PLAYER 2 */

    #crosshair2 {

      left: 60%;
      top: 55%;

      color: #ff6bba;

      text-shadow:
        0 0 4px black,
        0 0 10px #ff6bba,
        0 0 18px #ff6bba;
    }



    /* =========================
       ＋100表示
    ========================= */

    .plusScore {

      position: absolute;

      transform: translate(-50%, -50%);

      font-size: 34px;

      font-weight: 900;

      color: #fff36b;

      text-shadow:
        0 0 4px black,
        0 0 8px black;

      pointer-events: none;

      z-index: 800;

      animation: plusAnimation .65s forwards;
    }


    @keyframes plusAnimation {

      0% {
        opacity: 1;
        transform:
          translate(-50%, -50%)
          scale(.8);
      }

      100% {
        opacity: 0;

        transform:
          translate(-50%, -110%)
          scale(1.3);
      }
    }



    /* =========================
       スタート画面
    ========================= */

    #startScreen {

      position: absolute;

      inset: 0;

      display: flex;

      flex-direction: column;

      justify-content: center;
      align-items: center;

      gap: 20px;

      background: rgba(0, 0, 0, .58);

      z-index: 2000;

      color: white;

      text-align: center;
    }


    #startScreen h1 {

      font-size: 60px;

      color: #ffe35a;

      text-shadow:
        4px 4px 0 #7f351d,
        0 0 16px #ffae00;
    }


    #startScreen p {

      font-size: 23px;

      font-weight: bold;

      text-shadow:
        2px 2px 3px black;
    }


    #startButton {

      margin-top: 10px;

      padding: 15px 45px;

      font-size: 28px;

      font-weight: bold;

      border: 4px solid white;

      border-radius: 18px;

      background: #d94b28;

      color: white;

      cursor: pointer;

      box-shadow:
        0 5px 0 #742417;
    }


    #startButton:active {

      transform: translateY(4px);

      box-shadow:
        0 1px 0 #742417;
    }



    /* =========================
       結果画面
    ========================= */

    #resultScreen {

      position: absolute;

      inset: 0;

      display: none;

      flex-direction: column;

      justify-content: center;
      align-items: center;

      gap: 18px;

      background: rgba(0, 0, 0, .72);

      z-index: 3000;

      color: white;

      text-align: center;
    }


    #resultScreen h1 {

      font-size: 58px;

      color: #ffe35a;

      text-shadow:
        3px 3px 0 #8b321c;
    }


    .resultScore {

      font-size: 35px;

      font-weight: bold;
    }


    #resultP1 {

      color: #55eaff;
    }


    #resultP2 {

      color: #ff6bba;
    }


    #totalScore {

      margin-top: 10px;

      font-size: 45px;

      color: #fff36b;

      font-weight: 900;
    }


    #restartButton {

      margin-top: 20px;

      padding: 13px 35px;

      font-size: 24px;

      font-weight: bold;

      border: 3px solid white;

      border-radius: 15px;

      background: #d94b28;

      color: white;

      cursor: pointer;
    }


  </style>

</head>



<body>


<div id="game">


  <!-- =====================
       上の表示
  ====================== -->

  <div id="hud">

    <div
      id="score1"
      class="scoreBox"
    >
      P1 : 0
    </div>


    <div id="timer">
      15.0
    </div>


    <div
      id="score2"
      class="scoreBox"
    >
      P2 : 0
    </div>

  </div>



  <!-- =====================
       照準
  ====================== -->

  <div
    id="crosshair1"
    class="crosshair"
  >
    ＋
  </div>


  <div
    id="crosshair2"
    class="crosshair"
  >
    ＋
  </div>



  <!-- =====================
       スタート
  ====================== -->

  <div id="startScreen">

    <h1>
      BONUS STAGE
    </h1>

    <p>
      100点の的をたくさん狙え！
    </p>

    <p>
      🩵 P1：右Joy-Con X
     　
      🩷 P2：左Joy-Con ▼
    </p>

    <button id="startButton">
      START
    </button>

  </div>



  <!-- =====================
       結果
  ====================== -->

  <div id="resultScreen">

    <h1>
      BONUS FINISH!
    </h1>

    <div
      id="resultP1"
      class="resultScore"
    ></div>

    <div
      id="resultP2"
      class="resultScore"
    ></div>

    <div id="totalScore"></div>

    <button id="restartButton">
      もう一度
    </button>

  </div>


</div>



<script>


/* ==========================================
   基本設定
========================================== */


const GAME_TIME = 15;


/*
  的が出てくる間隔

  750 = 今回の設定

  数字を大きくすると
  的と的の間隔が広くなる
*/
const TARGET_INTERVAL = 750;


const TARGET_SCORE = 100;


/*
  奥から手前まで来る時間
*/
const TRAVEL_TIME = 2800;


/*
  手前から落ちる時間
*/
const DROP_TIME = 430;


/*
  照準の速さ
*/
const CURSOR_SPEED = 900;


/*
  スティックの小さいブレを無視
*/
const DEADZONE = 0.12;



/* ==========================================
   HTML
========================================== */


const game =
  document.getElementById("game");


const score1Text =
  document.getElementById("score1");


const score2Text =
  document.getElementById("score2");


const timerText =
  document.getElementById("timer");


const crosshair1 =
  document.getElementById("crosshair1");


const crosshair2 =
  document.getElementById("crosshair2");


const startScreen =
  document.getElementById("startScreen");


const startButton =
  document.getElementById("startButton");


const resultScreen =
  document.getElementById("resultScreen");


const resultP1 =
  document.getElementById("resultP1");


const resultP2 =
  document.getElementById("resultP2");


const totalScore =
  document.getElementById("totalScore");


const restartButton =
  document.getElementById("restartButton");



/* ==========================================
   PLAYER設定

   P1
   右Joy-Con
   水色
   Xボタン

   P2
   左Joy-Con
   ピンク
   ▼ボタン
========================================== */


const players = [


  /* PLAYER 1 = 右Joy-Con */

  {

    x: .40,
    y: .55,

    score: 0,

    axisX: 2,
    axisY: 3,

    fireButton: 2,

    oldFire: false,

    crosshair: crosshair1

  },



  /* PLAYER 2 = 左Joy-Con */

  {

    x: .60,
    y: .55,

    score: 0,

    axisX: 0,
    axisY: 1,

    fireButton: 13,

    oldFire: false,

    crosshair: crosshair2

  }


];



/* ==========================================
   4本のレーン
========================================== */


const lanes = [

  {
    backX: .255,
    frontX: .235
  },

  {
    backX: .415,
    frontX: .405
  },

  {
    backX: .585,
    frontX: .595
  },

  {
    backX: .745,
    frontX: .765
  }

];


const BACK_Y = .45;


const FRONT_Y = .76;


const DROP_Y = 1.02;



/* ==========================================
   ゲーム状態
========================================== */


let playing = false;


let startTime = 0;


let previousFrame = 0;


let targets = [];


let nextSpawnTimes = [
  0,
  0,
  0,
  0
];



/* ==========================================
   スタート
========================================== */


function startGame() {


  /*
    古い的を全部削除
  */

  for (
    const target of targets
  ) {

    target.element.remove();

  }


  targets = [];


  /*
    スコアリセット
  */

  players[0].score = 0;

  players[1].score = 0;


  updateScores();



  /*
    照準初期位置
  */

  players[0].x = .40;

  players[0].y = .55;


  players[1].x = .60;

  players[1].y = .55;


  updateCrosshairs();



  /*
    発射ボタン状態リセット
  */

  players[0].oldFire = false;

  players[1].oldFire = false;



  /*
    画面切り替え
  */

  startScreen.style.display = "none";

  resultScreen.style.display = "none";


  playing = true;


  startTime =
    performance.now();


  previousFrame =
    startTime;



  /*
    最初からレーン上に
    的を並べておく
  */

  createStartingTargets();



  /*
    最初の的と重ならないように
    次の出現は650ms後
  */

  for (
    let i = 0;
    i < 4;
    i++
  ) {

    nextSpawnTimes[i] =
      startTime + TARGET_INTERVAL;

  }



  requestAnimationFrame(
    gameLoop
  );

}



/* ==========================================
   最初の的
========================================== */


function createStartingTargets() {


  /*
    各レーン4個ずつ
  */

  const startingCount = 4;


  for (
    let laneIndex = 0;
    laneIndex < lanes.length;
    laneIndex++
  ) {


    for (
      let i = 0;
      i < startingCount;
      i++
    ) {


      /*
        少し前に生まれたことにして
        最初からレーン上に並べる
      */

      const fakeBorn =
        performance.now()
        -
        i * TARGET_INTERVAL;


      createTarget(
        laneIndex,
        fakeBorn
      );

    }

  }

}



/* ==========================================
   的を作る
========================================== */


function createTarget(
  laneIndex,
  bornTime = performance.now()
) {


  if (!playing) {
    return;
  }


  const element =
    document.createElement("div");


  element.className =
    "target";


  element.textContent =
    "100";


  game.appendChild(
    element
  );


  const target = {

    element: element,

    laneIndex: laneIndex,

    bornTime: bornTime,

    dropping: false,

    dropStart: 0,

    dropX: 0,

    hit: false

  };


  targets.push(
    target
  );


  updateOneTarget(
    target,
    performance.now()
  );

}



/* ==========================================
   的を一定間隔で追加
========================================== */


function updateSpawning(now) {


  for (
    let laneIndex = 0;
    laneIndex < lanes.length;
    laneIndex++
  ) {


    /*
      フレームが少し遅れても
      出現を飛ばさない
    */

    while (
      now >= nextSpawnTimes[laneIndex]
    ) {


      createTarget(
        laneIndex,
        nextSpawnTimes[laneIndex]
      );


      nextSpawnTimes[laneIndex] +=
        TARGET_INTERVAL;

    }

  }

}



/* ==========================================
   的を動かす
========================================== */


function updateTargets(now) {


  const copy =
    [...targets];


  for (
    const target of copy
  ) {


    updateOneTarget(
      target,
      now
    );

  }

}



/* ==========================================
   的1個の動き
========================================== */


function updateOneTarget(
  target,
  now
) {


  if (
    target.hit
  ) {

    return;

  }


  const lane =
    lanes[target.laneIndex];



  /* =========================
     レールを進む
  ========================= */


  if (
    !target.dropping
  ) {


    let progress =

      (
        now
        -
        target.bornTime
      )
      /
      TRAVEL_TIME;


    if (
      progress >= 1
    ) {


      progress = 1;


      target.dropping =
        true;


      target.dropStart =
        now;


      target.dropX =
        lane.frontX;

    }



    const x =

      lane.backX
      +
      (
        lane.frontX
        -
        lane.backX
      )
      *
      progress;


    const y =

      BACK_Y
      +
      (
        FRONT_Y
        -
        BACK_Y
      )
      *
      progress;



    /*
      奥は小さく
      手前ほど大きくする
    */

    const scale =

      .22
      +
      1.03
      *
      progress;



    target.element.style.left =
      `${x * 100}%`;


    target.element.style.top =
      `${y * 100}%`;


    target.element.style.transform =
      `scale(${scale})`;


    target.element.style.opacity =
      "1";


    return;

  }



  /* =========================
     手前から落下
  ========================= */


  let dropProgress =

    (
      now
      -
      target.dropStart
    )
    /
    DROP_TIME;



  if (
    dropProgress >= 1
  ) {


    removeTarget(
      target
    );


    return;

  }



  const direction =

    target.laneIndex < 2
      ?
      -1
      :
      1;



  const x =

    target.dropX
    +
    direction
    *
    .018
    *
    dropProgress;



  const y =

    FRONT_Y
    +
    (
      DROP_Y
      -
      FRONT_Y
    )
    *
    dropProgress;



  const rotation =

    direction
    *
    12
    *
    dropProgress;



  const scale =

    1.25
    +
    .12
    *
    dropProgress;



  let opacity = 1;


  if (
    dropProgress > .65
  ) {


    opacity =

      1
      -
      (
        dropProgress
        -
        .65
      )
      /
      .35;

  }



  target.element.style.left =
    `${x * 100}%`;


  target.element.style.top =
    `${y * 100}%`;


  target.element.style.transform =

    `scale(${scale})
     rotate(${rotation}deg)`;


  target.element.style.opacity =
    opacity;

}



/* ==========================================
   的を削除
========================================== */


function removeTarget(target) {


  const index =
    targets.indexOf(target);


  if (
    index !== -1
  ) {

    targets.splice(
      index,
      1
    );

  }


  target.element.remove();

}



/* ==========================================
   照準を表示
========================================== */


function updateCrosshairs() {


  for (
    const player of players
  ) {


    player.crosshair.style.left =
      `${player.x * 100}%`;


    player.crosshair.style.top =
      `${player.y * 100}%`;

  }

}



/* ==========================================
   Gamepad取得

   右Joy-Conを先に接続
   左Joy-Conを次に接続
   しておけばより確実
========================================== */


function getJoyCons() {


  const pads =

    Array
      .from(
        navigator.getGamepads
          ?
          navigator.getGamepads()
          :
          []
      )
      .filter(Boolean);



  let right = null;

  let left = null;



  /*
    名前から右・左を探す
  */

  for (
    const pad of pads
  ) {


    const id =
      pad.id.toLowerCase();


    if (
      id.includes("joy-con (r)")
      ||
      id.includes("joy-con r")
      ||
      id.includes("right")
    ) {

      right = pad;

    }


    if (
      id.includes("joy-con (l)")
      ||
      id.includes("joy-con l")
      ||
      id.includes("left")
    ) {

      left = pad;

    }

  }



  /*
    名前で判別できなかった場合

    右Joy-Conを先、
    左Joy-Conを後に
    Bluetooth接続する想定
  */

  if (
    !right
    &&
    pads.length >= 1
  ) {

    right = pads[0];

  }


  if (
    !left
    &&
    pads.length >= 2
  ) {

    left = pads[1];

  }



  return {

    right,
    left

  };

}



/* ==========================================
   スティックの小さいブレ処理
========================================== */


function cleanAxis(value) {


  if (
    Math.abs(value)
    <
    DEADZONE
  ) {

    return 0;

  }


  /*
    デッドゾーンの外側を
    なめらかに補正
  */

  const sign =
    Math.sign(value);


  const amount =

    (
      Math.abs(value)
      -
      DEADZONE
    )
    /
    (
      1
      -
      DEADZONE
    );


  return (
    sign
    *
    amount
  );

}



/* ==========================================
   1人分のJoy-Con操作
========================================== */


function controlPlayer(
  player,
  pad,
  deltaTime
) {


  if (!pad) {
    return;
  }



  let axisX =

    pad.axes[player.axisX]
    ??
    0;


  let axisY =

    pad.axes[player.axisY]
    ??
    0;



  axisX =
    cleanAxis(axisX);


  axisY =
    cleanAxis(axisY);



  const gameWidth =
    game.clientWidth;


  const gameHeight =
    game.clientHeight;



  player.x +=

    axisX
    *
    CURSOR_SPEED
    *
    deltaTime
    /
    gameWidth;



  player.y +=

    axisY
    *
    CURSOR_SPEED
    *
    deltaTime
    /
    gameHeight;



  /*
    画面外に出ないようにする
  */

  player.x =
    Math.max(
      .02,
      Math.min(
        .98,
        player.x
      )
    );


  player.y =
    Math.max(
      .06,
      Math.min(
        .98,
        player.y
      )
    );



  /*
    発射ボタン
  */

  const button =

    pad.buttons[
      player.fireButton
    ];



  const fire =

    button
      ?
      button.pressed
      :
      false;



  /*
    押した瞬間だけ発射
  */

  if (
    fire
    &&
    !player.oldFire
  ) {

    shoot(player);

  }


  player.oldFire =
    fire;

}



/* ==========================================
   発射
========================================== */


function shoot(player) {


  if (!playing) {
    return;
  }



  const gameRect =
    game.getBoundingClientRect();



  const cursorX =

    gameRect.left
    +
    player.x
    *
    gameRect.width;



  const cursorY =

    gameRect.top
    +
    player.y
    *
    gameRect.height;



  /*
    手前の的から判定する
  */

  const targetCopy =

    [...targets]
      .reverse();



  for (
    const target of targetCopy
  ) {


    /*
      落ち始めた的は撃てない
    */

    if (
      target.dropping
      ||
      target.hit
    ) {

      continue;

    }



    const rect =

      target.element
        .getBoundingClientRect();



    if (

      cursorX >= rect.left
      &&
      cursorX <= rect.right
      &&
      cursorY >= rect.top
      &&
      cursorY <= rect.bottom

    ) {


      hitTarget(
        player,
        target
      );


      return;

    }

  }

}



/* ==========================================
   命中
========================================== */


function hitTarget(
  player,
  target
) {


  target.hit = true;


  player.score +=
    TARGET_SCORE;


  updateScores();



  /*
    +100
  */

  const plus =

    document.createElement(
      "div"
    );


  plus.className =
    "plusScore";


  plus.textContent =
    `+${TARGET_SCORE}`;



  const rect =

    target.element
      .getBoundingClientRect();


  const gameRect =

    game.getBoundingClientRect();



  plus.style.left =

    `${
      rect.left
      -
      gameRect.left
      +
      rect.width / 2
    }px`;


  plus.style.top =

    `${
      rect.top
      -
      gameRect.top
      +
      rect.height / 2
    }px`;


  game.appendChild(
    plus
  );


  setTimeout(
    () => plus.remove(),
    700
  );


  removeTarget(
    target
  );

}



/* ==========================================
   スコア表示
========================================== */


function updateScores() {


  score1Text.textContent =

    `P1 : ${players[0].score}`;


  score2Text.textContent =

    `P2 : ${players[1].score}`;

}



/* ==========================================
   キーボード予備操作

   Space = P1
   Enter = P2
========================================== */


document.addEventListener(
  "keydown",
  event => {


    if (!playing) {
      return;
    }


    if (
      event.code === "Space"
      &&
      !event.repeat
    ) {


      event.preventDefault();


      shoot(
        players[0]
      );

    }



    if (
      event.code === "Enter"
      &&
      !event.repeat
    ) {


      shoot(
        players[1]
      );

    }

  }
);



/* ==========================================
   マウス操作

   マウス = P1
========================================== */


game.addEventListener(
  "mousemove",
  event => {


    if (!playing) {
      return;
    }


    const rect =

      game.getBoundingClientRect();


    players[0].x =

      (
        event.clientX
        -
        rect.left
      )
      /
      rect.width;


    players[0].y =

      (
        event.clientY
        -
        rect.top
      )
      /
      rect.height;


    updateCrosshairs();

  }
);



game.addEventListener(
  "mousedown",
  event => {


    if (!playing) {
      return;
    }


    /*
      スタートボタン等では発射しない
    */

    if (
      event.target.closest("button")
    ) {

      return;

    }


    shoot(
      players[0]
    );

  }
);



/* ==========================================
   メインループ
========================================== */


function gameLoop(now) {


  if (!playing) {
    return;
  }



  /*
    前フレームとの差
  */

  let deltaTime =

    (
      now
      -
      previousFrame
    )
    /
    1000;


  previousFrame =
    now;



  /*
    タブ切替などで
    急に飛ばないようにする
  */

  deltaTime =

    Math.min(
      deltaTime,
      .05
    );



  const elapsed =

    (
      now
      -
      startTime
    )
    /
    1000;



  const remaining =

    GAME_TIME
    -
    elapsed;



  /*
    終了
  */

  if (
    remaining <= 0
  ) {


    timerText.textContent =
      "0.0";


    endGame();


    return;

  }



  timerText.textContent =

    remaining
      .toFixed(1);



  /*
    Joy-Con
  */

  const joyCons =
    getJoyCons();



  /*
    PLAYER 1
    右Joy-Con
  */

  controlPlayer(

    players[0],

    joyCons.right,

    deltaTime

  );



  /*
    PLAYER 2
    左Joy-Con
  */

  controlPlayer(

    players[1],

    joyCons.left,

    deltaTime

  );



  updateCrosshairs();


  updateSpawning(now);


  updateTargets(now);



  requestAnimationFrame(
    gameLoop
  );

}



/* ==========================================
   ゲーム終了
========================================== */


function endGame() {


  playing = false;



  /*
    残っている的を削除
  */

  for (
    const target of targets
  ) {

    target.element.remove();

  }


  targets = [];



  resultP1.textContent =

    `🩵 P1 BONUS：${players[0].score}点`;


  resultP2.textContent =

    `🩷 P2 BONUS：${players[1].score}点`;



  const total =

    players[0].score
    +
    players[1].score;



  totalScore.textContent =

    `TOTAL：${total}点`;



  resultScreen.style.display =
    "flex";

}



/* ==========================================
   ボタン
========================================== */


startButton.addEventListener(
  "click",
  startGame
);


restartButton.addEventListener(
  "click",
  startGame
);



/* ==========================================
   最初の照準表示
========================================== */


updateCrosshairs();


</script>


</body>
