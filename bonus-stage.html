<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bonus Stage</title>

<style>
* {
  box-sizing: border-box;
  user-select: none;
  -webkit-user-select: none;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: Arial, sans-serif;
}

#game {
  position: relative;

  width: min(100vw, calc(100vh * 1.6));
  height: min(100vh, calc(100vw / 1.6));

  margin: auto;

  top: 50%;
  transform: translateY(-50%);

  overflow: hidden;

  background-image: url("bonus-bg.png");
  background-size: 100% 100%;
  background-position: center;
  background-repeat: no-repeat;

  cursor: none;
}


/* =========================
   スコア
========================= */

.scoreBox {
  position: absolute;
  top: 2%;

  padding: 10px 18px;

  color: white;

  font-size: clamp(18px, 2.3vw, 36px);
  font-weight: bold;

  text-shadow:
    3px 3px 0 #000,
    -2px -2px 0 #000;

  z-index: 200;
}

#p1ScoreBox {
  left: 2%;
}

#p2ScoreBox {
  right: 2%;
  text-align: right;
}


/* =========================
   タイマー
========================= */

#timer {
  position: absolute;

  top: 2%;
  left: 50%;

  transform: translateX(-50%);

  color: #fff34d;

  font-size: clamp(25px, 3vw, 48px);
  font-weight: 900;

  text-shadow:
    3px 3px 0 #000,
    -2px -2px 0 #000;

  z-index: 200;
}


/* =========================
   的
========================= */

.target {
  position: absolute;

  width: 100px;
  height: 100px;

  left: 50%;
  top: 50%;

  border-radius: 50%;

  background:
    radial-gradient(
      circle,
      #fff 0%,
      #fff 20%,
      #e72828 21%,
      #e72828 40%,
      #fff 41%,
      #fff 60%,
      #e72828 61%,
      #e72828 100%
    );

  border: 5px solid #ffd83d;

  display: flex;
  align-items: center;
  justify-content: center;

  color: #169b44;

  font-size: 24px;
  font-weight: 900;

  text-shadow:
    1px 1px 0 white,
    -1px -1px 0 white;

  box-shadow:
    0 6px 10px rgba(0,0,0,.5);

  transform-origin: center;

  z-index: 20;
}


/* =========================
   照準
========================= */

.crosshair {
  position: absolute;

  width: 70px;
  height: 70px;

  transform: translate(-50%, -50%);

  border-radius: 50%;

  pointer-events: none;

  z-index: 500;
}

.crosshair::before,
.crosshair::after {
  content: "";
  position: absolute;
}

.crosshair::before {
  width: 100%;
  height: 6px;

  top: 50%;
  left: 0;

  transform: translateY(-50%);
}

.crosshair::after {
  width: 6px;
  height: 100%;

  left: 50%;
  top: 0;

  transform: translateX(-50%);
}

#crosshair1 {
  border: 5px solid #25a8ff;
}

#crosshair1::before,
#crosshair1::after {
  background: #25a8ff;
}

#crosshair2 {
  border: 5px solid #ff4646;
}

#crosshair2::before,
#crosshair2::after {
  background: #ff4646;
}


/* =========================
   +100
========================= */

.plusScore {
  position: absolute;

  color: #fff43d;

  font-size: clamp(24px, 3vw, 45px);
  font-weight: 900;

  transform: translate(-50%, -50%);

  text-shadow:
    3px 3px 0 #000;

  pointer-events: none;

  z-index: 600;

  animation: plusAnimation .5s forwards;
}

@keyframes plusAnimation {

  0% {
    opacity: 1;

    transform:
      translate(-50%, -50%)
      scale(.8);
  }

  50% {
    transform:
      translate(-50%, -90%)
      scale(1.25);
  }

  100% {
    opacity: 0;

    transform:
      translate(-50%, -140%)
      scale(1);
  }

}


/* =========================
   START / FINISH
========================= */

.overlay {
  position: absolute;

  inset: 0;

  background: rgba(0,0,0,.55);

  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;

  color: white;

  z-index: 1000;
}

.overlay h1 {
  margin: 0;

  font-size: clamp(40px, 7vw, 100px);

  color: #ffe545;

  text-shadow:
    5px 5px 0 #b52222,
    8px 8px 0 #000;
}

.overlay p {
  font-size: clamp(18px, 2vw, 32px);
  font-weight: bold;
}

.overlay button {
  margin-top: 20px;

  padding: 15px 40px;

  font-size: clamp(20px, 2vw, 30px);
  font-weight: bold;

  border: 0;
  border-radius: 18px;

  background: #ffd83d;

  cursor: pointer;

  box-shadow: 0 5px 0 #b57a00;
}

.hidden {
  display: none;
}

#finalScore {
  font-size: clamp(20px, 3vw, 46px);

  font-weight: bold;

  text-align: center;

  line-height: 1.7;
}

</style>
</head>

<body>

<div id="game">

  <div id="p1ScoreBox" class="scoreBox">
    P1：<span id="score1">0</span>
  </div>

  <div id="timer">
    15.0
  </div>

  <div id="p2ScoreBox" class="scoreBox">
    P2：<span id="score2">0</span>
  </div>


  <div id="crosshair1" class="crosshair"></div>
  <div id="crosshair2" class="crosshair"></div>


  <div id="startScreen" class="overlay">

    <h1>BONUS!</h1>

    <p>
      100点の的を撃ちまくれ！
    </p>

    <button id="startButton">
      START
    </button>

  </div>


  <div id="finishScreen" class="overlay hidden">

    <h1>TIME UP!</h1>

    <div id="finalScore"></div>

    <button id="retryButton">
      もう一回
    </button>

  </div>

</div>


<script>


/* ==================================================
   設定
================================================== */

const GAME_TIME = 15;


/* 1枚の的の点数 */

const TARGET_SCORE = 100;


/*
  同じレーンで次の的が出るまでの時間

  550ms = かなりたくさん

  もっと大量なら
  450

  少し減らすなら
  650
*/

const TARGET_INTERVAL = 700;


/*
  奥から手前まで来る時間
*/

const TRAVEL_TIME = 2800;


/*
  一番手前から下へ落ちる時間
*/

const DROP_TIME = 430;


/*
  照準速度
*/

const CURSOR_SPEED = 900;


const DEADZONE = 0.12;



/* ==================================================
   HTML
================================================== */

const game =
  document.getElementById("game");

const score1Text =
  document.getElementById("score1");

const score2Text =
  document.getElementById("score2");

const timerText =
  document.getElementById("timer");

const crosshair1 =
  document.getElementById("crosshair1");

const crosshair2 =
  document.getElementById("crosshair2");

const startScreen =
  document.getElementById("startScreen");

const finishScreen =
  document.getElementById("finishScreen");

const finalScore =
  document.getElementById("finalScore");



/* ==================================================
   プレイヤー
================================================== */

const players = [

  {

    x: .42,
    y: .65,

    score: 0,

    axisX: 0,
    axisY: 1,

    /* 左Joy-Con 下▼ */

    fireButton: 13,

    oldFire: false,

    crosshair: crosshair1

  },


  {

    x: .58,
    y: .65,

    score: 0,

    axisX: 2,
    axisY: 3,

    /* 右Joy-Con X */

    fireButton: 2,

    oldFire: false,

    crosshair: crosshair2

  }

];



/* ==================================================
   4本のレーン
================================================== */

/*
  backX
  → 奥にいるとき

  frontX
  → 一番手前

  背景に合わせて位置を調整してある
*/

const lanes = [

  {
    backX: .255,
    frontX: .235
  },

  {
    backX: .415,
    frontX: .405
  },

  {
    backX: .585,
    frontX: .595
  },

  {
    backX: .745,
    frontX: .765
  }

];


/*
  レール奥
*/

const BACK_Y = .51;


/*
  レール一番手前

  ここまで来たら
  次は下へ落ちる
*/

const FRONT_Y = .90;


/*
  落ちたあとの位置
*/

const DROP_Y = 1.12;



/* ==================================================
   ゲーム変数
================================================== */

let targets = [];

let playing = false;

let startTime = 0;

let previousFrame =
  performance.now();


/*
  各レーンで
  次に的を出す時間
*/

let nextSpawnTimes = [
  0,
  0,
  0,
  0
];



/* ==================================================
   START
================================================== */

document
.getElementById("startButton")
.addEventListener(
  "click",
  startGame
);


document
.getElementById("retryButton")
.addEventListener(
  "click",
  startGame
);



function startGame() {

  /*
    古い的を全部消す
  */

  targets.forEach(target => {

    target.element.remove();

  });


  targets = [];


  /*
    スコアリセット
  */

  players[0].score = 0;
  players[1].score = 0;


  score1Text.textContent = 0;
  score2Text.textContent = 0;



  /*
    照準位置
  */

  players[0].x = .42;
  players[0].y = .65;

  players[1].x = .58;
  players[1].y = .65;


  players.forEach(player => {

    player.oldFire = false;

  });


  startScreen.classList.add("hidden");

  finishScreen.classList.add("hidden");


  playing = true;


  startTime =
    performance.now();



  /*
    4レーンとも
    一定間隔で出す
  */

  nextSpawnTimes = [
    startTime,
    startTime,
    startTime,
    startTime
  ];



  /*
    最初からレール上に
    的が何個か並んでいるようにする

    これで開始直後も
    スカスカにならない
  */

  createStartingTargets();

}



/* ==================================================
   開始時に的を並べておく
================================================== */

function createStartingTargets() {

  /*
    1レーンにつき4枚
  */

  const startingCount = 4;


  for (
    let lane = 0;
    lane < 4;
    lane++
  ) {

    for (
      let i = 0;
      i < startingCount;
      i++
    ) {

      /*
        TARGET_INTERVAL分ずつ
        年齢をずらす
      */

      const fakeBorn =
        performance.now()
        -
        i * TARGET_INTERVAL;


      spawnTarget(
        lane,
        fakeBorn
      );

    }

  }

}



/* ==================================================
   的生成
================================================== */

function spawnTarget(
  laneNumber,
  bornTime = performance.now()
) {

  const element =
    document.createElement("div");


  element.className =
    "target";


  element.textContent =
    "100";


  game.appendChild(element);


  const target = {

    element: element,

    lane: laneNumber,

    born: bornTime,

    x:
      lanes[laneNumber].backX,

    y:
      BACK_Y,

    scale:
      .25,

    dead:
      false,

    dropping:
      false

  };


  targets.push(target);

}



/* ==================================================
   的を動かす
================================================== */

function updateTargets(now) {

  targets.forEach(target => {

    if (target.dead) {

      return;

    }


    /*
      生まれてから何秒経ったか
    */

    const age =
      now - target.born;



    /* =========================================
       ① レール上を進む
    ========================================= */

    if (
      age <= TRAVEL_TIME
    ) {

      const progress =
        age / TRAVEL_TIME;


      const lane =
        lanes[target.lane];



      /*
        奥 → 手前
      */

      target.x =
        lane.backX
        +
        (
          lane.frontX
          -
          lane.backX
        )
        *
        progress;



      target.y =
        BACK_Y
        +
        (
          FRONT_Y
          -
          BACK_Y
        )
        *
        progress;



      /*
        手前ほど大きく
      */

      target.scale =
        .22
        +
        progress * 1.03;



      target.element.style.opacity =
        "1";


      target.element.style.transform =
        `
        translate(-50%, -50%)
        scale(${target.scale})
        rotate(0deg)
        `;


      target.element.style.zIndex =
        20
        +
        Math.floor(
          progress * 100
        );

    }



    /* =========================================
       ② レールの先で下へ落ちる
    ========================================= */

    else {

      target.dropping = true;


      const dropAge =
        age
        -
        TRAVEL_TIME;


      const dropProgress =
        dropAge
        /
        DROP_TIME;



      /*
        落下終了
      */

      if (
        dropProgress >= 1
      ) {

        target.dead = true;

        target.element.remove();

        return;

      }



      const lane =
        lanes[target.lane];


      /*
        Xはほぼそのまま

        少しだけ外側へ流すと
        立体感が出る
      */

      const outward =
        (
          target.lane < 2
          ? -1
          : 1
        );


      target.x =
        lane.frontX
        +
        outward
        *
        .015
        *
        dropProgress;



      /*
        下へ落下
      */

      target.y =
        FRONT_Y
        +
        (
          DROP_Y
          -
          FRONT_Y
        )
        *
        dropProgress;



      /*
        少し小さくなる
      */

      target.scale =
        1.25
        -
        .18
        *
        dropProgress;



      /*
        少し回転

        トロッコの先から
        ストンと落ちる感じ
      */

      const rotation =
        outward
        *
        12
        *
        dropProgress;



      /*
        最後だけ少し透明に
      */

      let opacity = 1;


      if (
        dropProgress > .65
      ) {

        opacity =
          1
          -
          (
            dropProgress
            -
            .65
          )
          /
          .35;

      }



      target.element.style.opacity =
        opacity;


      target.element.style.transform =
        `
        translate(-50%, -50%)
        scale(${target.scale})
        rotate(${rotation}deg)
        `;


      target.element.style.zIndex =
        150;

    }



    target.element.style.left =
      (target.x * 100)
      +
      "%";


    target.element.style.top =
      (target.y * 100)
      +
      "%";

  });



  /*
    消えた的を配列から削除
  */

  targets =
    targets.filter(
      target => !target.dead
    );

}



/* ==================================================
   一定間隔で的を生成
================================================== */

function updateSpawning(now) {

  for (
    let lane = 0;
    lane < 4;
    lane++
  ) {

    if (
      now >=
      nextSpawnTimes[lane]
    ) {

      spawnTarget(
        lane
      );


      /*
        ランダムじゃなく
        必ず同じ間隔
      */

      nextSpawnTimes[lane]
        +=
        TARGET_INTERVAL;

    }

  }

}



/* ==================================================
   Joy-Con
================================================== */

function updateControllers(dt) {

  const gamepads =
    navigator.getGamepads
    ?
    navigator.getGamepads()
    :
    [];


  const connected =
    [];


  for (
    let i = 0;
    i < gamepads.length;
    i++
  ) {

    if (
      gamepads[i]
    ) {

      connected.push(
        gamepads[i]
      );

    }

  }



  connected.forEach(
    gamepad => {

      const id =
        gamepad.id
        .toLowerCase();



      /*
        LEFT
      */

      if (
        id.includes("left")
        ||
        id.includes(
          "joy-con (l)"
        )
      ) {

        controlPlayer(
          players[0],
          gamepad,
          dt
        );

      }



      /*
        RIGHT
      */

      else if (
        id.includes("right")
        ||
        id.includes(
          "joy-con (r)"
        )
      ) {

        controlPlayer(
          players[1],
          gamepad,
          dt
        );

      }

    }

  );



  /*
    名前で判定できない場合
  */

  if (
    connected.length >= 2
  ) {

    const hasLeft =
      connected.some(
        gamepad =>
          gamepad.id
          .toLowerCase()
          .includes("left")
      );


    const hasRight =
      connected.some(
        gamepad =>
          gamepad.id
          .toLowerCase()
          .includes("right")
      );


    if (!hasLeft) {

      controlPlayer(
        players[0],
        connected[0],
        dt
      );

    }


    if (!hasRight) {

      controlPlayer(
        players[1],
        connected[1],
        dt
      );

    }

  }

}



/* ==================================================
   プレイヤー操作
================================================== */

function controlPlayer(
  player,
  gamepad,
  dt
) {

  let axisX =
    gamepad.axes[
      player.axisX
    ]
    ||
    0;


  let axisY =
    gamepad.axes[
      player.axisY
    ]
    ||
    0;



  if (
    Math.abs(axisX)
    <
    DEADZONE
  ) {

    axisX = 0;

  }


  if (
    Math.abs(axisY)
    <
    DEADZONE
  ) {

    axisY = 0;

  }



  const rect =
    game.getBoundingClientRect();



  player.x +=
    axisX
    *
    CURSOR_SPEED
    *
    dt
    /
    rect.width;



  player.y +=
    axisY
    *
    CURSOR_SPEED
    *
    dt
    /
    rect.height;



  player.x =
    Math.max(
      .02,
      Math.min(
        .98,
        player.x
      )
    );


  player.y =
    Math.max(
      .08,
      Math.min(
        .96,
        player.y
      )
    );



  const button =
    gamepad.buttons[
      player.fireButton
    ];


  const pressed =
    button
    &&
    button.pressed;



  /*
    押した瞬間に発射
  */

  if (
    pressed
    &&
    !player.oldFire
    &&
    playing
  ) {

    shoot(
      player
    );

  }


  player.oldFire =
    pressed;

}



/* ==================================================
   発射
================================================== */

function shoot(player) {

  let bestTarget = null;

  let bestDistance =
    Infinity;


  const rect =
    game.getBoundingClientRect();


  const playerX =
    player.x
    *
    rect.width;


  const playerY =
    player.y
    *
    rect.height;



  targets.forEach(target => {

    if (
      target.dead
      ||
      target.dropping
    ) {

      return;

    }


    const targetX =
      target.x
      *
      rect.width;


    const targetY =
      target.y
      *
      rect.height;


    const dx =
      playerX
      -
      targetX;


    const dy =
      playerY
      -
      targetY;


    const distance =
      Math.sqrt(
        dx * dx
        +
        dy * dy
      );



    /*
      的の見た目に合わせて
      当たり判定も拡大
    */

    const radius =
      43
      *
      target.scale;



    if (
      distance
      <
      radius
      &&
      distance
      <
      bestDistance
    ) {

      bestTarget =
        target;


      bestDistance =
        distance;

    }

  });



  if (
    !bestTarget
  ) {

    return;

  }



  player.score +=
    TARGET_SCORE;



  if (
    player
    ===
    players[0]
  ) {

    score1Text.textContent =
      player.score;

  }

  else {

    score2Text.textContent =
      player.score;

  }



  showPlus100(
    bestTarget.x,
    bestTarget.y
  );



  bestTarget.dead = true;

  bestTarget.element.remove();

}



/* ==================================================
   +100表示
================================================== */

function showPlus100(
  x,
  y
) {

  const plus =
    document.createElement(
      "div"
    );


  plus.className =
    "plusScore";


  plus.textContent =
    "+100";


  plus.style.left =
    (x * 100)
    +
    "%";


  plus.style.top =
    (y * 100)
    +
    "%";


  game.appendChild(
    plus
  );


  setTimeout(
    () => {

      plus.remove();

    },

    550

  );

}



/* ==================================================
   照準
================================================== */

function updateCrosshairs() {

  players.forEach(
    player => {

      player.crosshair
      .style.left =
        (
          player.x
          *
          100
        )
        +
        "%";


      player.crosshair
      .style.top =
        (
          player.y
          *
          100
        )
        +
        "%";

    }

  );

}



/* ==================================================
   Macテスト用

   P1 = Space
   P2 = Enter
================================================== */

document.addEventListener(
  "keydown",
  event => {

    if (
      !playing
    ) {

      return;

    }


    if (
      event.code
      ===
      "Space"
      &&
      !event.repeat
    ) {

      shoot(
        players[0]
      );

    }


    if (
      event.code
      ===
      "Enter"
      &&
      !event.repeat
    ) {

      shoot(
        players[1]
      );

    }

  }
);



/* ==================================================
   マウステスト
================================================== */

game.addEventListener(
  "mousemove",
  event => {

    if (
      !playing
    ) {

      return;

    }


    const rect =
      game.getBoundingClientRect();


    players[0].x =
      (
        event.clientX
        -
        rect.left
      )
      /
      rect.width;


    players[0].y =
      (
        event.clientY
        -
        rect.top
      )
      /
      rect.height;

  }
);



game.addEventListener(
  "mousedown",
  () => {

    if (
      playing
    ) {

      shoot(
        players[0]
      );

    }

  }
);



/* ==================================================
   終了
================================================== */

function finishGame() {

  playing = false;



  targets.forEach(
    target => {

      target.element.remove();

    }
  );


  targets = [];



  const total =
    players[0].score
    +
    players[1].score;



  finalScore.innerHTML =
    `
    P1 BONUS：${players[0].score} 点
    <br>

    P2 BONUS：${players[1].score} 点
    <br><br>

    TOTAL：${total} 点
    `;


  finishScreen
    .classList
    .remove(
      "hidden"
    );

}



/* ==================================================
   メインループ
================================================== */

function gameLoop(now) {

  const dt =
    Math.min(
      (
        now
        -
        previousFrame
      )
      /
      1000,

      .05
    );


  previousFrame =
    now;



  updateControllers(
    dt
  );


  updateCrosshairs();



  if (
    playing
  ) {

    const elapsed =
      (
        now
        -
        startTime
      )
      /
      1000;



    const remaining =
      Math.max(
        0,
        GAME_TIME
        -
        elapsed
      );



    timerText.textContent =
      remaining
      .toFixed(1);



    /*
      一定間隔で
      4レーンに追加
    */

    updateSpawning(
      now
    );



    /*
      的を前進
    */

    updateTargets(
      now
    );



    if (
      remaining <= 0
    ) {

      finishGame();

    }

  }



  requestAnimationFrame(
    gameLoop
  );

}



requestAnimationFrame(
  gameLoop
);

</script>
